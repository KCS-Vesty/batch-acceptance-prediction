[package]
name = "batch-acceptance-app"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui_extras = "0.28"
rfd = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
regex = "1"
rayon = "1.10"
anyhow = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.25", default-features = false }
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
